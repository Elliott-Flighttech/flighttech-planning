const parseCSV = (text) => {
  const lines = text.split("\n").filter((l) => l.trim());
  if (lines.length < 2) return [];
  const headers = lines[0].split(",").map((h) => h.trim().replace(/^"|"$/g, ""));
  return lines.slice(1).map((line) => {
    const values = [];
    let current = "";
    let inQuotes = false;
    for (const ch of line) {
      if (ch === '"') { inQuotes = !inQuotes; }
      else if (ch === "," && !inQuotes) { values.push(current.trim()); current = ""; }
      else { current += ch; }
    }
    values.push(current.trim());
    const obj = {};
    headers.forEach((h, i) => { obj[h] = (values[i] || "").replace(/^"|"$/g, ""); });
    return obj;
  }).filter((row) => row.tail_number && row.arrival_date);
};

const getWeekRange = (dateStr) => {
  const d = new Date(dateStr + "T12:00:00");
  const day = d.getDay();
  const mon = new Date(d); mon.setDate(d.getDate() - ((day + 6) % 7));
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  return { start: mon.toISOString().slice(0, 10), end: sun.toISOString().slice(0, 10) };
};
const getMonthRange = (dateStr) => {
  const d = new Date(dateStr + "T12:00:00");
  return { start: new Date(d.getFullYear(), d.getMonth(), 1).toISOString().slice(0,10), end: new Date(d.getFullYear(), d.getMonth()+1, 0).toISOString().slice(0,10) };
};
const getDatesInRange = (start, end) => {
  const dates = []; let cur = new Date(start + "T12:00:00"); const last = new Date(end + "T12:00:00");
  while (cur <= last) { dates.push(cur.toISOString().slice(0, 10)); cur.setDate(cur.getDate() + 1); }
  return dates;
};
const timeToMinutes = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + (m || 0); };

// ─── NEW: Multi-day Gantt segment calculator ───
// Given a flight (with arrivalDate/Time and departureDate/Time) and a specific day,
// returns the horizontal segment (left%, width%) that should be rendered for that day,
// or null if the flight doesn't span that day.
//
// Also returns `isStart` and `isEnd` flags so we can style the edges
// (rounded corners only on the first and last day of the stay).
const getFlightSegmentForDay = (flight, dayStr) => {
  const arrDate = flight.arrivalDate;
  const depDate = flight.departureDate || flight.arrivalDate;

  // Day is outside the flight's date range
  if (dayStr < arrDate || dayStr > depDate) return null;

  const isStart = dayStr === arrDate;
  const isEnd = dayStr === depDate;
  const isSingleDay = isStart && isEnd;

  let startMin, endMin;

  if (isSingleDay) {
    startMin = timeToMinutes(flight.arrivalTime);
    endMin = timeToMinutes(flight.departureTime);
    // Safety: if somehow departure <= arrival on same day, render until end of day
    if (endMin <= startMin) endMin = 1440;
  } else if (isStart) {
    // First day: from arrival time to end of day
    startMin = timeToMinutes(flight.arrivalTime);
    endMin = 1440;
  } else if (isEnd) {
    // Last day: from start of day to departure time
    startMin = 0;
    endMin = timeToMinutes(flight.departureTime);
  } else {
    // Middle day: full 24 hours
    startMin = 0;
    endMin = 1440;
  }

  const leftPct = (startMin / 1440) * 100;
  const widthPct = Math.max(((endMin - startMin) / 1440) * 100, 1);

  return { leftPct, widthPct, isStart, isEnd, isSingleDay };
};

function StatusBadge({flight}) {
  const now = new Date();
  const arr = new Date(flight.arrivalDate + "T" + flight.arrivalTime);
  const dep = new Date((flight.departureDate||flight.arrivalDate) + "T" + flight.departureTime);
  let label="Scheduled", color="#8892a4", bg="rgba(136,146,164,0.1)";
  if(now>=arr&&now<=dep){label="On Bay";color="#10B981";bg="rgba(16,185,129,0.15)";}
  else if(now>dep){label="Completed";color="#6366F1";bg="rgba(99,102,241,0.15)";}
  return <span style={{fontSize:11,fontWeight:600,padding:"3px 10px",borderRadius:20,color,background:bg,whiteSpace:"nowrap"}}>{label}</span>;
}

function FlightForm({clients,initial,onSave,onDelete,onCancel,selectedDate}) {
  const [form, setForm] = useState(initial || {clientId:clients[0]?.id||"",tailNumber:"",arrivalDate:selectedDate,arrivalTime:"08:00",departureDate:selectedDate,departureTime:"18:00",serviceType:"transit",notes:""});
  const update = (k,v) => setForm(p=>({...p,[k]:v}));
  const handleSave = () => { if(!form.tailNumber.trim()) return; onSave(form); };
  return <>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
      <Field label="Client"><select value={form.clientId} onChange={e=>update("clientId",e.target.value)} style={inputStyle}>{clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></Field>
      <Field label="Tail Number"><input value={form.tailNumber} onChange={e=>update("tailNumber",e.target.value.toUpperCase())} placeholder="N12345" style={inputStyle}/></Field>
      <Field label="Arrival Date"><input type="date" value={form.arrivalDate} onChange={e=>update("arrivalDate",e.target.value)} style={inputStyle}/></Field>
      <Field label="Arrival Time (ETA)"><input type="time" value={form.arrivalTime} onChange={e=>update("arrivalTime",e.target.value)} style={inputStyle}/></Field>
      <Field label="Departure Date"><input type="date" value={form.departureDate||form.arrivalDate} onChange={e=>update("departureDate",e.target.value)} style={inputStyle}/></Field>
      <Field label="Departure Time (ETD)"><input type="time" value={form.departureTime} onChange={e=>update("departureTime",e.target.value)} style={inputStyle}/></Field>
    </div>
    <Field label="Service Type"><select value={form.serviceType} onChange={e=>update("serviceType",e.target.value)} style={inputStyle}>{SERVICE_TYPES.map(s=><option key={s.id} value={s.id}>{s.label} ({s.labelEs})</option>)}</select></Field>
    <Field label="Notes"><textarea value={form.notes||""} onChange={e=>update("notes",e.target.value)} rows={2} placeholder="Additional details..." style={{...inputStyle,resize:"vertical"}}/></Field>
    <div style={{display:"flex",justifyContent:"space-between",marginTop:20}}>
      <div>{onDelete && <button onClick={onDelete} style={{...btnSecondary,color:"#EF4444",borderColor:"rgba(239,68,68,0.3)"}}>Delete</button>}</div>
      <div style={{display:"flex",gap:10}}><button onClick={onCancel} style={btnSecondary}>Cancel</button><button onClick={handleSave} style={btnPrimary}>{initial?"Save Changes":"Add Flight"}</button></div>
    </div>
  </>;
}

function ClientManager({clients,setClients}) {
  const [editId,setEditId]=useState(null);

  const addClient=()=>{if(!newClient.name.trim()||!newClient.short.trim())return;setClients(p=>[...p,{...newClient,id:"c-"+Date.now()}]);setNewClient({name:"",short:"",color:"#0EA5E9"});};

  const removeClient=(id)=>{if(clients.length<=1)return;setClients(p=>p.filter(c=>c.id!==id));};
  return <div>
    <div style={{marginBottom:20}}>{clients.map(c=><div key={c.id} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 12px",borderRadius:10,marginBottom:6,background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.05)"}}>

      {editId===c.id?<>
        <input value={c.name} onChange={e=>updateClient(c.id,{name:e.target.value})} style={{...inputStyle,flex:1,padding:"6px 10px"}}/>
        <input value={c.short} onChange={e=>updateClient(c.id,{short:e.target.value.toUpperCase()})} style={{...inputStyle,width:60,padding:"6px 10px"}} maxLength={4}/>
        <div style={{display:"flex",gap:3}}>{COLORS.map(col=><div key={col} onClick={()=>updateClient(c.id,{color:col})} style={{width:18,height:18,borderRadius:"50%",background:col,cursor:"pointer",border:c.color===col?"2px solid #fff":"2px solid transparent"}}/>)}</div>
        <button onClick={()=>setEditId(null)} style={{background:"none",border:"none",color:"#10B981",cursor:"pointer"}}><Icon name="check" size={16}/></button>
      </>:<>
        <span style={{flex:1,fontSize:14,fontWeight:500,color:"#f0f4f8"}}>{c.name}</span>
        <span style={{fontSize:12,fontWeight:700,fontFamily:"'JetBrains Mono', monospace",color:c.color}}>{c.short}</span>
        <button onClick={()=>setEditId(c.id)} style={{background:"none",border:"none",color:"#8892a4",cursor:"pointer"}}><Icon name="edit" size={14}/></button>
        <button onClick={()=>removeClient(c.id)} style={{background:"none",border:"none",color:"#8892a4",cursor:"pointer",opacity:0.5}}><Icon name="trash" size={14}/></button>
      </>}
    </div>)}</div>
    <div style={{display:"flex",gap:10,alignItems:"end"}}>
      <Field label="Name"><input value={newClient.name} onChange={e=>setNewClient(p=>({...p,name:e.target.value}))} placeholder="Aerolínea XYZ" style={{...inputStyle,padding:"8px 12px"}}/></Field>
      <Field label="Code"><input value={newClient.short} onChange={e=>setNewClient(p=>({...p,short:e.target.value.toUpperCase()}))} placeholder="XYZ" maxLength={4} style={{...inputStyle,width:70,padding:"8px 12px"}}/></Field>
      <div style={{display:"flex",gap:3,paddingBottom:16}}>{COLORS.slice(0,5).map(col=><div key={col} onClick={()=>setNewClient(p=>({...p,color:col}))} style={{width:22,height:22,borderRadius:"50%",background:col,cursor:"pointer",border:newClient.color===col?"2px solid #fff":"2px solid transparent"}}/>)}</div>
      <button onClick={addClient} style={{...btnPrimary,padding:"8px 16px",marginBottom:16,whiteSpace:"nowrap"}}>+ Add</button>
    </div>
  </div>;
}

function SheetsConfigPanel({config,clients,onSave,onSync,onCancel}) {
  const [sheetId,setSheetId]=useState(config?.sheetId||"");
  const [tabs,setTabs]=useState(config?.tabs||clients.map((c,i)=>({gid:"",clientId:c.id,name:c.name})));
  const extractSheetId=(input)=>{const m=input.match(/\/d\/([a-zA-Z0-9_-]+)/);return m?m[1]:input.trim();};
  const updateTab=(idx,field,value)=>setTabs(p=>p.map((t,i)=>i===idx?{...t,[field]:value}:t));
  const handleSave=()=>{const cfg={sheetId:extractSheetId(sheetId),tabs:tabs.filter(t=>t.gid!=="")};onSave(cfg);};
  const handleSync=()=>{const cfg={sheetId:extractSheetId(sheetId),tabs:tabs.filter(t=>t.gid!=="")};onSync(cfg);};
  const infoStyle={fontSize:12,color:"#8892a4",lineHeight:1.6,marginBottom:16};
  const codeStyle={background:"rgba(255,255,255,0.06)",padding:"2px 6px",borderRadius:4,fontFamily:"'JetBrains Mono', monospace",fontSize:11,color:"#0EA5E9"};
  return <div>
    <div style={infoStyle}><strong style={{color:"#f0f4f8"}}>Steps to connect:</strong><br/>
    1. Upload the Excel template to Google Drive → Abrir como Google Sheets<br/>
    2. In the Sheet: <span style={codeStyle}>Archivo → Compartir → Publicar en la web</span><br/>
    3. Select <span style={codeStyle}>Documento completo</span> → formato <span style={codeStyle}>Página web</span> → Publicar<br/>
    4. Copy the Google Sheet URL and paste it below<br/>
    5. For each client, enter the <span style={codeStyle}>gid</span> of its tab</div>
    <Field label="Google Sheet URL or ID"><input value={sheetId} onChange={e=>setSheetId(e.target.value)} placeholder="https://docs.google.com/spreadsheets/d/1abc123.../edit" style={inputStyle}/></Field>
    <div style={{fontSize:12,fontWeight:600,color:"#8892a4",marginBottom:10,textTransform:"uppercase",letterSpacing:"0.05em"}}>Tabs per Client — GID of each tab</div>
    <div style={infoStyle}>El <span style={codeStyle}>gid</span> appears in the URL: <span style={codeStyle}>...#gid=<strong>123456789</strong></span></div>
    {tabs.map((tab,idx)=>{const client=clients.find(c=>c.id===tab.clientId);return <div key={idx} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
      <div style={{width:10,height:10,borderRadius:"50%",background:client?.color||"#666",flexShrink:0}}/>
      <span style={{fontSize:13,fontWeight:500,minWidth:160,color:"#f0f4f8"}}>{client?.name||tab.name}</span>
      <input value={tab.gid} onChange={e=>updateTab(idx,"gid",e.target.value)} placeholder="gid (ej: 0, 123456789)" style={{...inputStyle,flex:1,padding:"8px 12px",fontSize:13}}/>
    </div>;})}
    <div style={{display:"flex",justifyContent:"space-between",marginTop:24}}>
      <button onClick={onCancel} style={btnSecondary}>Cancel</button>
      <div style={{display:"flex",gap:10}}><button onClick={handleSave} style={btnSecondary}>Save Config</button><button onClick={handleSync} style={btnPrimary}>Save & Sync</button></div>
    </div>
  </div>;
}

function App() {
  const [flights,setFlights]=useState([]);
  const [clients,setClients]=useState(DEFAULT_CLIENTS);
  const [loaded,setLoaded]=useState(false);
  const [view,setView]=useState("week");
  const [selectedDate,setSelectedDate]=useState(todayStr());
  const [clientFilter,setClientFilter]=useState("all");
  const [mechanicFilter,setMechanicFilter]=useState("all");
  const [showAddModal,setShowAddModal]=useState(false);
  const [showClientModal,setShowClientModal]=useState(false);
  const [editingFlight,setEditingFlight]=useState(null);
  const [showTable,setShowTable]=useState(false);
  const [showSheetsModal,setShowSheetsModal]=useState(false);
  const [sheetsConfig,setSheetsConfig]=useState(HARDCODED_SHEETS_CONFIG);
  const [syncing,setSyncing]=useState(false);
  const [lastSync,setLastSync]=useState(null);
  const [syncError,setSyncError]=useState(null);

  const syncFromSheets = useCallback(async (config) => {
    if(!config?.sheetId||!config?.tabs?.length)return;
    setSyncing(true); setSyncError(null);
    try {
      const allFlights=[];
      for(const tab of config.tabs){
        if(!tab.gid&&tab.gid!==0)continue;
        const url=buildSheetCSVUrl(config.sheetId,tab.gid);
        const resp=await fetch(url);
        if(!resp.ok)throw new Error(`Error tab ${tab.name}: ${resp.status}`);
        const text=await resp.text();
        const rows=parseCSV(text);
        allFlights.push(...rows.filter(r=>r.status!=="cancelled").map(r=>sheetRowToFlight(r,tab.clientId)));
      }
      setFlights(allFlights);
      setLastSync(new Date().toLocaleTimeString("en-US",{timeZone:"America/New_York",hour:"2-digit",minute:"2-digit"}));
    }catch(err){setSyncError(err.message);console.error(err);}
    finally{setSyncing(false);}
  },[]);

  useEffect(()=>{
    const c=loadData(CLIENTS_KEY,DEFAULT_CLIENTS);
    // Merge: if localStorage has fewer clients than DEFAULT_CLIENTS, add the missing ones
    // This ensures Skybus (c7) appears even for users who already had c1-c6 saved
    const mergedClients = [...c];
    DEFAULT_CLIENTS.forEach(defaultClient => {
      if (!mergedClients.find(existing => existing.id === defaultClient.id)) {
        mergedClients.push(defaultClient);
      }
    });
    setClients(mergedClients);
    setLoaded(true);
    setTimeout(()=>syncFromSheets(HARDCODED_SHEETS_CONFIG),300);
  },[syncFromSheets]);

  useEffect(()=>{if(loaded)saveData(CLIENTS_KEY,clients);},[clients,loaded]);

  const resetDemo=()=>{syncFromSheets(HARDCODED_SHEETS_CONFIG);setView("week");setSelectedDate(todayStr());setClientFilter("all");setMechanicFilter("all");};

  const dateRange=useMemo(()=>{
    if(view==="day")return{start:selectedDate,end:selectedDate};
    if(view==="week")return getWeekRange(selectedDate);
    return getMonthRange(selectedDate);
  },[view,selectedDate]);
  const datesInRange=useMemo(()=>getDatesInRange(dateRange.start,dateRange.end),[dateRange]);

  // ─── FIX: Filter flights by overlap with the range, not just arrivalDate ───
  // A flight "belongs" to the range if ANY part of its stay (arrival→departure)
  // falls within the visible window. This ensures multi-day stays appear on
  // every day they occupy, not just the arrival day.
  const filteredFlights=useMemo(()=>flights.filter(f=>{
    const depDate = f.departureDate || f.arrivalDate;
    const overlaps = f.arrivalDate <= dateRange.end && depDate >= dateRange.start;
    const inClient = clientFilter==="all" || f.clientId===clientFilter;
    const inMechanic = mechanicFilter==="all" || (f.mechanics||[]).includes(mechanicFilter);
    return overlaps && inClient && inMechanic;
  }),[flights,dateRange,clientFilter,mechanicFilter]);

  // List of all mechanics currently assigned (for the filter dropdown)
  const allMechanics=useMemo(()=>{
    const set=new Set();
    flights.forEach(f=>(f.mechanics||[]).forEach(m=>set.add(m)));
    return [...set].sort((a,b)=>a.localeCompare(b));
  },[flights]);

  // Mechanics assigned within the CURRENT view (respects date range + filters),
  // with how many flights each one covers. Powers the header crew panel.
  const viewMechanics=useMemo(()=>{
    const counts={};
    filteredFlights.forEach(f=>(f.mechanics||[]).forEach(m=>{counts[m]=(counts[m]||0)+1;}));
    return Object.entries(counts).map(([name,count])=>({name,count}))
      .sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name));
  },[filteredFlights]);

  const navigate=(dir)=>{const d=new Date(selectedDate+"T12:00:00");if(view==="day")d.setDate(d.getDate()+dir);else if(view==="week")d.setDate(d.getDate()+dir*7);else d.setMonth(d.getMonth()+dir);setSelectedDate(d.toISOString().slice(0,10));};
  const addFlight=(flight)=>{setFlights(p=>[...p,{...flight,id:"f-"+Date.now()+Math.random().toString(36).slice(2,6)}]);setShowAddModal(false);};
  const updateFlight=(flight)=>{setFlights(p=>p.map(f=>f.id===flight.id?flight:f));setEditingFlight(null);};
  const deleteFlight=(id)=>{setFlights(p=>p.filter(f=>f.id!==id));setEditingFlight(null);};
  const getClient=(id)=>clients.find(c=>c.id===id)||{name:"?",color:"#666",short:"?"};

  const stats=useMemo(()=>{
    const today=todayStr();
    // FIX: Count flights present today (stays that overlap today), not just arrivals
    const todayFlights=flights.filter(f=>{
      const dep = f.departureDate || f.arrivalDate;
      return f.arrivalDate <= today && dep >= today;
    });
    const wr=getWeekRange(today);
    const weekFlights=flights.filter(f=>{
      const dep = f.departureDate || f.arrivalDate;
      return f.arrivalDate <= wr.end && dep >= wr.start;
    });
    const now=new Date();
    const inHangar=flights.filter(f=>{const a=new Date(f.arrivalDate+"T"+f.arrivalTime);const d=new Date((f.departureDate||f.arrivalDate)+"T"+f.departureTime);return now>=a&&now<=d;});
    return{today:todayFlights.length,week:weekFlights.length,inHangar:inHangar.length};
  },[flights]);

  const headerLabel=useMemo(()=>{
    if(view==="day")return fmtDay(selectedDate+"T12:00:00");
    if(view==="week")return `${fmtDay(dateRange.start+"T12:00:00")} — ${fmtDay(dateRange.end+"T12:00:00")}`;
    return new Date(selectedDate+"T12:00:00").toLocaleDateString("en-US",{timeZone:MIAMI_TZ,month:"long",year:"numeric"});
  },[view,selectedDate,dateRange]);

  if(!loaded)return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",background:"#0d1117",color:"#8892a4"}}>Loading...</div>;

  return <div style={{minHeight:"100vh",background:"#0d1117",color:"#f0f4f8",fontFamily:"'DM Sans', sans-serif"}}>
    {/* Header */}
    <div style={{position:"sticky",top:0,zIndex:100,background:"linear-gradient(180deg, #131825 0%, #0d1117 100%)",borderBottom:"1px solid rgba(255,255,255,0.06)",padding:"16px 28px 16px 28px",backdropFilter:"blur(12px)"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:16}}>
        <div style={{display:"flex",alignItems:"center",gap:14}}>
          <div style={{width:44,height:44,borderRadius:10,background:"linear-gradient(135deg, #0EA5E9, #6366F1)",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff"}}><Icon name="plane" size={22}/></div>
          <div><h1 style={{margin:0,fontSize:20,fontWeight:700,letterSpacing:"-0.02em"}}>Flight Tech — Planning Board</h1><p style={{margin:0,fontSize:12,color:"#8892a4"}}>MRO Schedule Dashboard · Miami Time (EST)</p></div>
        </div>
        <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
          {sheetsConfig?.sheetId?<button onClick={()=>syncFromSheets(sheetsConfig)} disabled={syncing} style={{...btnSecondary,display:"flex",alignItems:"center",gap:6,padding:"8px 16px",fontSize:12,color:syncing?"#8892a4":"#10B981",borderColor:syncing?"rgba(255,255,255,0.06)":"rgba(16,185,129,0.3)"}}>{syncing?"⟳ Syncing...":"⟳ Sync Sheets"}{lastSync&&!syncing&&<span style={{fontSize:10,color:"#8892a4",marginLeft:4}}>({lastSync})</span>}</button>:null}
          <button onClick={()=>setShowSheetsModal(true)} style={{...btnSecondary,display:"flex",alignItems:"center",gap:6,padding:"8px 16px",fontSize:12,color:"#10B981",borderColor:"rgba(16,185,129,0.3)"}}>📊 Sheets ✓</button>
          <button onClick={resetDemo} style={{...btnSecondary,display:"flex",alignItems:"center",gap:6,padding:"8px 16px",fontSize:12,color:"#8892a4"}}>↻ Reload</button>
          <button onClick={()=>setShowClientModal(true)} style={{...btnSecondary,display:"flex",alignItems:"center",gap:6,padding:"8px 16px"}}><Icon name="settings" size={15}/> Clients</button>
          <button onClick={()=>{setEditingFlight(null);setShowAddModal(true);}} style={{...btnPrimary,display:"flex",alignItems:"center",gap:6,padding:"8px 16px"}}><Icon name="plus" size={15}/> New Flight</button>
        </div>
      </div>
      <div style={{display:"flex",gap:14,marginTop:20,flexWrap:"wrap"}}>
        {[{label:"Today",value:stats.today,icon:"plane",color:"#0EA5E9"},{label:"This Week",value:stats.week,icon:"calendar",color:"#8B5CF6"},{label:"On Bay Now",value:stats.inHangar,icon:"clock",color:"#10B981"}].map(s=>
          <div key={s.label} className="stat-card" style={{background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:14,padding:"14px 20px",minWidth:140,transition:"all 0.2s",backdropFilter:"blur(8px)"}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}><div style={{color:s.color}}><Icon name={s.icon} size={14}/></div><span style={{fontSize:11,color:"#8892a4",textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:600}}>{s.label}</span></div>
            <span style={{fontSize:28,fontWeight:700,fontFamily:"'JetBrains Mono', monospace",color:s.color}}>{s.value}</span>
          </div>
        )}
        <div className="stat-card" style={{background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:14,padding:"14px 20px",flex:"1 1 260px",minWidth:240,backdropFilter:"blur(8px)"}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}><div style={{color:"#F59E0B"}}><Icon name="settings" size={14}/></div><span style={{fontSize:11,color:"#8892a4",textTransform:"uppercase",letterSpacing:"0.06em",fontWeight:600}}>Mechanics on Duty ({view==="day"?"día":view==="week"?"semana":"mes"})</span></div>
          {viewMechanics.length===0
            ?<span style={{fontSize:12,color:"#5a6472",fontStyle:"italic"}}>Sin mecánicos asignados en esta vista</span>
            :<div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {viewMechanics.map(m=>{
                const active=mechanicFilter===m.name;
                return <button key={m.name} onClick={()=>setMechanicFilter(active?"all":m.name)} title={active?"Quitar filtro":"Filtrar por "+m.name}
                  style={{display:"flex",alignItems:"center",gap:6,fontSize:12,fontWeight:600,cursor:"pointer",borderRadius:8,padding:"4px 9px",
                    color:active?"#0d1117":"#f0f4f8",
                    background:active?"#F59E0B":"rgba(245,158,11,0.15)",
                    border:"1px solid "+(active?"#F59E0B":"rgba(245,158,11,0.35)")}}>
                  {m.name}
                  <span style={{fontSize:10,fontWeight:700,fontFamily:"'JetBrains Mono', monospace",background:active?"rgba(13,17,23,0.25)":"rgba(245,158,11,0.25)",borderRadius:5,padding:"1px 5px"}}>{m.count}</span>
                </button>;
              })}
            </div>}
        </div>
      </div>
    </div>

    {/* Toolbar */}
    <div style={{padding:"16px 28px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12,borderBottom:"1px solid rgba(255,255,255,0.06)",background:"rgba(255,255,255,0.01)"}}>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <button onClick={()=>navigate(-1)} style={{...btnSecondary,padding:"7px 10px"}}><Icon name="chevLeft" size={16}/></button>
        <button onClick={()=>setSelectedDate(todayStr())} style={{...btnSecondary,padding:"7px 14px",fontSize:13}}>Today</button>
        <button onClick={()=>navigate(1)} style={{...btnSecondary,padding:"7px 10px"}}><Icon name="chevRight" size={16}/></button>
        <span style={{fontSize:15,fontWeight:600,marginLeft:8,textTransform:"capitalize"}}>{headerLabel}</span>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <div style={{display:"flex",background:"rgba(255,255,255,0.04)",borderRadius:10,border:"1px solid rgba(255,255,255,0.06)",overflow:"hidden"}}>
          {["day","week","month"].map(v=><button key={v} className="view-btn" onClick={()=>setView(v)} style={{padding:"7px 16px",border:"none",fontSize:13,fontWeight:600,cursor:"pointer",background:view===v?"rgba(14,165,233,0.2)":"transparent",color:view===v?"#0EA5E9":"#8892a4",fontFamily:"'DM Sans', sans-serif"}}>{v==="day"?"Day":v==="week"?"Week":"Month"}</button>)}
        </div>
        <button onClick={()=>setShowTable(!showTable)} style={{...btnSecondary,padding:"7px 10px"}}><Icon name={showTable?"grid":"list"} size={16}/></button>
        <select value={clientFilter} onChange={e=>setClientFilter(e.target.value)} style={{...inputStyle,width:"auto",minWidth:150,padding:"7px 32px 7px 12px",fontSize:13}}>
          <option value="all">All Clients</option>
          {clients.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
        <select value={mechanicFilter} onChange={e=>setMechanicFilter(e.target.value)} style={{...inputStyle,width:"auto",minWidth:150,padding:"7px 32px 7px 12px",fontSize:13}} title="Filter by mechanic">
          <option value="all">All Mechanics</option>
          {allMechanics.map(m=><option key={m} value={m}>{m}</option>)}
        </select>
        <input type="date" value={selectedDate} onChange={e=>setSelectedDate(e.target.value)} style={{...inputStyle,width:"auto",padding:"7px 12px",fontSize:13}}/>
      </div>
    </div>

    {/* Content */}
    <div style={{padding:"20px 28px"}}>
      {filteredFlights.length===0?
        <div style={{textAlign:"center",padding:"60px 20px",color:"#8892a4"}}><Icon name="plane" size={48}/><p style={{fontSize:16,marginTop:16}}>No flights scheduled for this period</p><button onClick={()=>setShowAddModal(true)} style={{...btnPrimary,marginTop:12}}>Add Flight</button></div>
      :showTable?
        <div style={{overflowX:"auto"}}>{datesInRange.map(date=>{
          // FIX: For the table view, show every flight that is present on this day
          // (not only flights whose arrivalDate === date)
          const dayFlights=filteredFlights.filter(f=>{
            const dep = f.departureDate || f.arrivalDate;
            return f.arrivalDate <= date && dep >= date;
          }).sort((a,b)=>{
            // Sort: flights arriving today first (by arrival time), then ongoing stays
            if (a.arrivalDate === date && b.arrivalDate !== date) return -1;
            if (b.arrivalDate === date && a.arrivalDate !== date) return 1;
            return a.arrivalTime.localeCompare(b.arrivalTime);
          });
          if(dayFlights.length===0)return null;
          return <div key={date} style={{marginBottom:24}}>
            {view!=="day"&&<h3 style={{fontSize:13,fontWeight:600,color:"#8892a4",marginBottom:10,textTransform:"capitalize"}}>{fmtDay(date+"T12:00:00")}</h3>}
            <div style={{borderRadius:14,border:"1px solid rgba(255,255,255,0.06)",overflow:"hidden"}}>
              <div style={{display:"grid",gridTemplateColumns:"60px 1fr 90px 90px 110px 1fr 90px 50px",padding:"10px 16px",background:"rgba(255,255,255,0.03)",fontSize:11,fontWeight:600,color:"#8892a4",textTransform:"uppercase",letterSpacing:"0.05em",gap:12}}>
                <span>Client</span><span>Tail</span><span>ETA</span><span>ETD</span><span>Service</span><span>Crew</span><span>Status</span><span></span>
              </div>
              {dayFlights.map(f=>{
                const cl=getClient(f.clientId);
                const svc=SERVICE_TYPES.find(s=>s.id===f.serviceType);
                const dep = f.departureDate || f.arrivalDate;
                const isArrivalDay = f.arrivalDate === date;
                const isDepartureDay = dep === date;
                // Show actual times on arrival/departure days; "—" for middle days (on bay all day)
                const etaDisplay = isArrivalDay ? f.arrivalTime : "—";
                const etdDisplay = isDepartureDay ? f.departureTime : "—";
                return <div key={f.id + "-" + date} className="flight-row" style={{display:"grid",gridTemplateColumns:"60px 1fr 90px 90px 110px 1fr 90px 50px",padding:"12px 16px",borderTop:"1px solid rgba(255,255,255,0.04)",alignItems:"center",gap:12,cursor:"pointer"}} onClick={()=>{setEditingFlight(f);setShowAddModal(true);}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}><div style={{width:8,height:8,borderRadius:"50%",background:cl.color,flexShrink:0}}/><span style={{fontSize:12,fontWeight:600,color:cl.color}}>{cl.short}</span></div>
                  <span style={{fontSize:14,fontWeight:600,fontFamily:"'JetBrains Mono', monospace"}}>{f.tailNumber}</span>
                  <span style={{fontSize:14,fontFamily:"'JetBrains Mono', monospace",color:isArrivalDay?"#10B981":"#8892a4"}}>{etaDisplay}</span>
                  <span style={{fontSize:14,fontFamily:"'JetBrains Mono', monospace",color:isDepartureDay?"#F97316":"#8892a4"}}>{etdDisplay}</span>
                  <span style={{fontSize:12,color:"#c1c9d6"}}>{svc?`${svc.label}`:f.serviceType}</span>
                  <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                    {(f.mechanics&&f.mechanics.length)?f.mechanics.map((m,i)=>
                      <span key={i} style={{fontSize:11,fontWeight:600,color:"#f0f4f8",background:"rgba(14,165,233,0.18)",border:"1px solid rgba(14,165,233,0.35)",borderRadius:6,padding:"2px 7px",whiteSpace:"nowrap"}}>{m}</span>
                    ):<span style={{fontSize:11,color:"#5a6472",fontStyle:"italic"}}>— sin asignar</span>}
                  </div>
                  <StatusBadge flight={f}/>
                  <button onClick={e=>{e.stopPropagation();deleteFlight(f.id);}} style={{background:"none",border:"none",color:"#8892a4",cursor:"pointer",padding:4,opacity:0.5}}><Icon name="trash" size={14}/></button>
                </div>;
              })}
            </div>
          </div>;
        })}</div>
      :
        <div style={{overflowX:"auto"}}>{datesInRange.map(date=>{
          // ─── FIX: Render every flight that occupies this day, not only arrivals ───
          const dayFlights=filteredFlights.filter(f=>{
            const dep = f.departureDate || f.arrivalDate;
            return f.arrivalDate <= date && dep >= date;
          }).sort((a,b)=>{
            // Flights arriving today sort by arrival time; ongoing stays anchor at 00:00
            const aStart = a.arrivalDate === date ? timeToMinutes(a.arrivalTime) : 0;
            const bStart = b.arrivalDate === date ? timeToMinutes(b.arrivalTime) : 0;
            return aStart - bStart;
          });
          if(dayFlights.length===0&&view==="day")return <div key={date} style={{textAlign:"center",padding:40,color:"#8892a4"}}>No flights scheduled</div>;
          if(dayFlights.length===0)return null;
          return <div key={date} style={{marginBottom:28}}>
            {view!=="day"&&<h3 style={{fontSize:13,fontWeight:600,color:"#8892a4",marginBottom:10,textTransform:"capitalize"}}>{fmtDay(date+"T12:00:00")} — {dayFlights.length} aircraft</h3>}
            <div style={{position:"relative",background:"rgba(255,255,255,0.02)",borderRadius:14,border:"1px solid rgba(255,255,255,0.08)",padding:"12px 16px",minHeight:60,backgroundImage:"repeating-linear-gradient(90deg, transparent, transparent calc(100%/24 - 1px), rgba(255,255,255,0.03) calc(100%/24 - 1px), rgba(255,255,255,0.03) calc(100%/24))"}}>
              <div style={{display:"flex",borderBottom:"1px solid rgba(255,255,255,0.06)",background:"rgba(255,255,255,0.01)",paddingBottom:6,marginBottom:8}}>
                {Array.from({length:24},(_,i)=><div key={i} style={{flex:1,fontSize:10,color:i%6===0?"#8892a4":"#444d5e",textAlign:"center",fontFamily:"'JetBrains Mono', monospace",fontWeight:i%6===0?600:400,borderLeft:"1px solid "+(i%6===0?"rgba(255,255,255,0.08)":"rgba(255,255,255,0.03)"),paddingTop:4}}>{String(i).padStart(2,"0")}:00</div>)}
              </div>
              {dayFlights.map(f=>{
                const cl=getClient(f.clientId);
                const seg = getFlightSegmentForDay(f, date);
                if (!seg) return null;
                // Rounded corners only on first/last day of the stay; flat edges in the middle
                const borderRadius = seg.isSingleDay
                  ? "8px"
                  : seg.isStart
                    ? "8px 2px 2px 8px"
                    : seg.isEnd
                      ? "2px 8px 8px 2px"
                      : "2px";
                // Edge indicators: dashed right border on the start day (continues), dashed left on end day
                const borderLeft = !seg.isStart ? `2px dashed ${cl.color}aa` : `2px solid ${cl.color}aa`;
                const borderRight = !seg.isEnd ? `2px dashed ${cl.color}aa` : `2px solid ${cl.color}aa`;
                return <div key={f.id + "-" + date} title={f.tailNumber+(f.mechanics&&f.mechanics.length?" — "+f.mechanics.join(", "):" — sin asignar")} style={{position:"relative",height:36,marginBottom:4,cursor:"pointer"}} onClick={()=>{setEditingFlight(f);setShowAddModal(true);}}>
                  <div style={{position:"absolute",left:seg.leftPct+"%",width:seg.widthPct+"%",height:30,borderRadius,background:cl.color+"44",borderTop:`2px solid ${cl.color}aa`,borderBottom:`2px solid ${cl.color}aa`,borderLeft,borderRight,boxShadow:`0 0 12px ${cl.color}33`,display:"flex",alignItems:"center",padding:"0 10px",gap:8,overflow:"hidden",transition:"all 0.2s"}}>
                    {seg.isStart && <span style={{fontSize:11,fontWeight:700,color:cl.color,whiteSpace:"nowrap"}}>{cl.short}</span>}
                    {seg.isStart && <span style={{fontSize:12,fontWeight:700,fontFamily:"'JetBrains Mono', monospace",whiteSpace:"nowrap",color:"#fff",textShadow:"0 1px 4px rgba(0,0,0,0.4)"}}>{f.tailNumber}</span>}
                    {!seg.isStart && <span style={{fontSize:11,fontWeight:600,color:cl.color,whiteSpace:"nowrap",opacity:0.8}}>↻ {f.tailNumber}</span>}
                    {seg.isStart && f.mechanics && f.mechanics.length>0 && <span style={{fontSize:10,fontWeight:600,color:"#0d1117",background:"#F59E0B",borderRadius:5,padding:"1px 6px",whiteSpace:"nowrap",textShadow:"none"}}>🔧 {f.mechanics.join(", ")}</span>}
                    <span style={{fontSize:10,color:"#c1c9d6",whiteSpace:"nowrap",marginLeft:"auto",fontWeight:500}}>
                      {seg.isSingleDay
                        ? `${f.arrivalTime}→${f.departureTime}`
                        : seg.isStart
                          ? `ETA ${f.arrivalTime} →`
                          : seg.isEnd
                            ? `→ ETD ${f.departureTime}`
                            : `on bay`}
                    </span>
                  </div>
                </div>;
              })}
            </div>
          </div>;
        })}</div>
      }
    </div>

    {syncError&&<div style={{margin:"0 28px",padding:"10px 16px",background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.3)",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"space-between"}}><span style={{fontSize:13,color:"#EF4444"}}>Error: {syncError}</span><button onClick={()=>setSyncError(null)} style={{background:"none",border:"none",color:"#EF4444",cursor:"pointer"}}><Icon name="x" size={14}/></button></div>}

    <Modal open={showAddModal} onClose={()=>{setShowAddModal(false);setEditingFlight(null);}} title={editingFlight?"Edit Flight":"New Flight"}>
      <FlightForm clients={clients} initial={editingFlight} onSave={editingFlight?updateFlight:addFlight} onDelete={editingFlight?()=>deleteFlight(editingFlight.id):null} onCancel={()=>{setShowAddModal(false);setEditingFlight(null);}} selectedDate={selectedDate}/>
    </Modal>
    <Modal open={showClientModal} onClose={()=>setShowClientModal(false)} title="Client Management" wide><ClientManager clients={clients} setClients={setClients}/></Modal>
    <Modal open={showSheetsModal} onClose={()=>setShowSheetsModal(false)} title="📊 Connect Google Sheets" wide>
      <SheetsConfigPanel config={sheetsConfig} clients={clients} onSave={cfg=>{setSheetsConfig(cfg);setShowSheetsModal(false);}} onSync={cfg=>{setSheetsConfig(cfg);syncFromSheets(cfg);setShowSheetsModal(false);}} onCancel={()=>setShowSheetsModal(false)}/>
    </Modal>
  </div>;
}

ReactDOM.render(React.createElement(App), document.getElementById('root'));
</script>
</body>
</html>
